name: Release CI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: on-failure

      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEY_ALIAS"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          mkdir -p OpenRealmLauncher
          printf "%s" "$KEYSTORE_BASE64" | base64 --decode > OpenRealmLauncher/openrealm-release.jks
          chmod 600 OpenRealmLauncher/openrealm-release.jks
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/OpenRealmLauncher/openrealm-release.jks" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Audit repository identity
        run: |
          set -euo pipefail
          old_id_patterns=$(
            printf '%s\n' \
              'Y29tLm1vdmVydHkuemFsaXRobGF1bmNoZXI=' \
              'Y29tL21vdmVydHkvemFsaXRobGF1bmNoZXI=' \
              'WmFsaXRoIExhdW5jaGVy' \
              'WmFsaXRoTGF1bmNoZXI=' \
              'emFsaXRobGF1bmNoZXI=' \
              'WmFsaXRoLUluZm8=' \
              'cmVwby5taWF3YS5jbi96YWxpdGgtaW5mbw==' \
              'aG9zdGVkLndlYmxhdGUub3JnL3Byb2plY3RzL3phbGl0aGxhdW5jaGVyMg==' \
            | while read -r encoded; do printf '%s' "$encoded" | base64 --decode; printf '\n'; done \
            | paste -sd'|' -
          )
          if git grep -nI -E "$old_id_patterns" -- . ':(exclude)README.md' ':(exclude)LICENSE'; then
            echo "Forbidden old upstream identity remains outside legal/documentary attribution."
            exit 1
          fi
      - name: Build signed ARM64 release
        env:
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :OpenRealmLauncher:assembleRelease -Darch=arm64

      - name: Verify and checksum APK
        run: |
          set -euo pipefail
          out="OpenRealmLauncher/build/outputs/apk/release"
          apk="$(find "$out" -type f -name "*arm64-v8a.apk" | head -n 1)"
          test -n "$apk"
          if find OpenRealmLauncher/build/outputs/apk -type f \( -name "*armeabi-v7a.apk" -o -name "*x86.apk" -o -name "*x86_64.apk" \) | grep -q .; then
            echo "Non-ARM64 APK detected"
            exit 1
          fi
          sha256sum "$apk" | tee "$out/SHA256SUMS.txt"
          unzip -Z1 "$apk" | grep "^lib/" | tee /tmp/native-list.txt || true
          if grep -Ev "^lib/arm64-v8a/" /tmp/native-list.txt | grep -q .; then
            echo "APK contains a non-ARM64 native library"
            exit 1
          fi

      - name: Upload APK and checksum to release
        if: github.event_name == 'release'
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk="$(find OpenRealmLauncher/build/outputs/apk/release -type f -name "*arm64-v8a.apk" | head -n 1)"
          sums="OpenRealmLauncher/build/outputs/apk/release/SHA256SUMS.txt"
          gh release upload "$TAG_NAME" "$apk" "$sums" --clobber
          cp "$apk" /tmp/openrealm-release.apk

      - name: Generate OpenRealm update feed
        if: github.event_name == 'release'
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          RELEASE_CREATED_AT: ${{ github.event.release.published_at }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          code="$(sed -n "s/^launcher_version_code=//p" OpenRealmLauncher/gradle.properties)"
          apk_name="$(basename /tmp/openrealm-release.apk)"
          apk_size="$(stat -c "%s" /tmp/openrealm-release.apk)"
          release_url="https://github.com/Rushabh-00/OpenRealmLauncher/releases/download/$TAG_NAME/$apk_name"
          export VERSION="$version" CODE="$code" APK_NAME="$apk_name" APK_SIZE="$apk_size" RELEASE_URL="$release_url" CREATED_AT="$RELEASE_CREATED_AT"
          python3 - <<PY
          import json, os
          from pathlib import Path
          data = {
            "code": int(os.environ["CODE"]),
            "version": os.environ["VERSION"],
            "created_at": os.environ["CREATED_AT"],
            "default_cloud_drive": None,
            "cloud_drives": [],
            "files": [{
              "file_name": os.environ["APK_NAME"],
              "uri": os.environ["RELEASE_URL"],
              "arch": "arm64",
              "size": int(os.environ["APK_SIZE"])
            }],
            "default_body": {"language": "en", "markdown": "OpenRealm Launcher " + os.environ["VERSION"]},
            "bodies": [{"language": "en", "markdown": "OpenRealm Launcher " + os.environ["VERSION"]}]
          }
          Path("/tmp/latest_version_md.json").write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY
          
      - name: Commit update feed to main
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/latest_version_md.json update/latest_version_md.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update/latest_version_md.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci: update OpenRealm release metadata"
          git push origin main
