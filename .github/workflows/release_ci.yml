name: Release CI

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Build:
    uses: ./.github/workflows/build.yml
    with:
      variant: Release
    secrets:
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

  Upload-to-Release:
    needs: Build
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v6

      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          pattern: OpenRealm release APK (arm64)
          path: ./artifacts
          merge-multiple: true

      - name: Upload APK and checksum
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk="$(find ./artifacts -type f -name "*arm64-v8a.apk" | head -n 1)"
          sums="$(find ./artifacts -type f -name "SHA256SUMS.txt" | head -n 1)"
          test -n "$apk"
          test -n "$sums"
          gh release upload "$TAG_NAME" "$apk" "$sums" --clobber
          cp "$apk" /tmp/openrealm-release.apk
          sha256sum /tmp/openrealm-release.apk | tee /tmp/openrealm.sha256

      - name: Update OpenRealm version metadata
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          RELEASE_CREATED_AT: ${{ github.event.release.published_at }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          code="$(sed -n "s/^launcher_version_code=//p" OpenRealmLauncher/gradle.properties)"
          apk_name="$(basename /tmp/openrealm-release.apk)"
          apk_size="$(stat -c "%s" /tmp/openrealm-release.apk)"
          release_url="https://github.com/Rushabh-00/OpenRealmLauncher/releases/download/$TAG_NAME/$apk_name"
          export VERSION="$version" CODE="$code" APK_NAME="$apk_name" APK_SIZE="$apk_size" RELEASE_URL="$release_url" CREATED_AT="$RELEASE_CREATED_AT"
          python3 - <<PY
import json, os
from pathlib import Path
data = {
  "code": int(os.environ["CODE"]),
  "version": os.environ["VERSION"],
  "created_at": os.environ["CREATED_AT"],
  "default_cloud_drive": None,
  "cloud_drives": [],
  "files": [{
    "file_name": os.environ["APK_NAME"],
    "uri": os.environ["RELEASE_URL"],
    "arch": "arm64",
    "size": int(os.environ["APK_SIZE"])
  }],
  "default_body": {"language": "en", "markdown": "OpenRealm Launcher " + os.environ["VERSION"]},
  "bodies": [{"language": "en", "markdown": "OpenRealm Launcher " + os.environ["VERSION"]}]
}
Path("/tmp/latest_version_md.json").write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
PY

      - name: Commit version metadata to main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/latest_version_md.json update/latest_version_md.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update/latest_version_md.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci: update OpenRealm release metadata"
          git push origin main