name: Build CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: on-failure

      - name: Audit repository identity
        run: |
          set -euo pipefail
          old_id_patterns=$( 
            printf '%s\n' \
              'Y29tLm1vdmVydHkuemFsaXRobGF1bmNoZXI=' \
              'Y29tL21vdmVydHkvemFsaXRobGF1bmNoZXI=' \
              'WmFsaXRoIExhdW5jaGVy' \
              'WmFsaXRoTGF1bmNoZXI=' \
              'emFsaXRobGF1bmNoZXI=' \
              'WmFsaXRoLUluZm8=' \
              'cmVwby5taWF3YS5jbi96YWxpdGgtaW5mbw==' \
              'aG9zdGVkLndlYmxhdGUub3JnL3Byb2plY3RzL3phbGl0aGxhdW5jaGVyMg==' \
            | while read -r encoded; do printf '%s' "$encoded" | base64 --decode; printf '\n'; done \
            | paste -sd'|' -
          )
          if git grep -nI -E "$old_id_patterns" -- . ':(exclude)README.md' ':(exclude)LICENSE'; then
            echo "Forbidden old upstream identity remains outside legal/documentary attribution."
            exit 1
          fi
          if git grep -nE 'LegacyRuntimeCompat|custom.*URLClassLoader|Caciocavallo.*JDK25|Java.*25.*compat|LaunchWrapper.*replacement' -- OpenRealmLauncher/src/main/java; then
            echo "Experimental Minecraft/Java runtime compatibility code detected."
            exit 1
          fi

      - name: Build ARM64 debug APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :OpenRealmLauncher:assembleDebug -Darch=arm64

      - name: Verify ARM64-only artifact
        run: |
          set -euo pipefail
          out="OpenRealmLauncher/build/outputs/apk/debug"
          apk="$(find "$out" -type f -name "*arm64-v8a.apk" | head -n 1)"
          test -n "$apk"
          if find OpenRealmLauncher/build/outputs/apk -type f \( -name "*armeabi-v7a.apk" -o -name "*x86.apk" -o -name "*x86_64.apk" \) | grep -q .; then
            echo "Non-ARM64 APK detected"
            exit 1
          fi
          unzip -Z1 "$apk" | grep "^lib/" | tee /tmp/native-list.txt || true
          if grep -Ev "^lib/arm64-v8a/" /tmp/native-list.txt | grep -q .; then
            echo "APK contains a non-ARM64 native library"
            exit 1
          fi
          sha256sum "$apk" | tee "$out/SHA256SUMS.txt"

      - name: Upload debug artifact
        uses: actions/upload-artifact@v7
        with:
          name: OpenRealm debug APK (arm64)
          path: |
            OpenRealmLauncher/build/outputs/apk/debug/*arm64-v8a.apk
            OpenRealmLauncher/build/outputs/apk/debug/SHA256SUMS.txt
